[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "pulp-lparray"
version = "2.0.0"
description = "PuLP x NumPy"
readme = "README.md"
license = "MIT-0"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2",
  "pulp>=4",
]

[dependency-groups]
dev = [
  "pulp[cbc]",
  "pytest",
  "ruff",
  "ty",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib --strict-config --strict-markers"
filterwarnings = ["error"]

[tool.hatch.build]
include = ["pulp_lparray"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "D",      # docstrings (intentionally not enforced)
  "TRY",    # try/except micro-style (intentionally not enforced)
  "COM",    # trailing commas (formatter handles)
  "EM",     # exception message micro-style
  "N",      # PuLP naming (lowBound, upBound, bigM) and the lowercase lparray class
  "PLR0913",# keep high-arity internal helpers
  "PLR2004",# magic numbers are fine
  "TC",     # type-checking blocks
  "CPY",    # no per-file copyright headers
]

[tool.ruff.format]
quote-style = "preserve"

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true # forwarding NumPy's dynamically typed dispatch arguments

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["INP001", "S101"]

[tool.ty.terminal]
error-on-warning = true
