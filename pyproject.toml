[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "pulp-lparray"
version = "1.0.20201204002401"
description = "PuLP x NumPy"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2",
  "pulp>=4",
]

[dependency-groups]
dev = [
  "pulp[cbc]",
  "pytest",
  "ruff",
  "ty",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"
filterwarnings = ["error"]

[tool.hatch.build]
include = ["pulp_lparray"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "D",      # docstrings (intentionally not enforced)
  "TRY",    # try/except micro-style (intentionally not enforced)
  "COM",    # trailing commas (formatter handles)
  "EM",     # exception message micro-style
  "N",      # allow pulp-ish naming (X, N, etc)
  "PLR0913",# keep high-arity internal helpers
  "PLR2004",# magic numbers are fine
  "S",      # asserts in tests / internal sentinels
  "TC",     # type-checking blocks
]

[tool.ruff.format]
quote-style = "preserve"

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true # forwarding NumPy's dynamically typed dispatch arguments
